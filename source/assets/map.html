<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><link rel="stylesheet" href="leaflet.css"><style>html,body,#map{height:100%;margin:0;background:#10232b}#note{position:absolute;z-index:1000;top:12px;left:55px;right:12px;background:#09191fee;color:#b8d0d6;padding:10px;border-radius:8px;font:12px sans-serif;pointer-events:none}.leaflet-control-attribution{font-size:9px}</style></head><body><div id="map"></div><div id="note">Observation locations, not transmitter positions. Internet required for map imagery.</div><script src="leaflet.js"></script><script>
const map=L.map('map').setView([25,0],2);
const street=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'});
const satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri — Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community'}).addTo(map);
L.control.layers({'Satellite':satellite,'Street':street}).addTo(map);
let observations=L.layerGroup().addTo(map),position=L.layerGroup().addTo(map),centered=false;
function updateData(data){observations.clearLayers();position.clearLayers();for(const item of data.observations){if(item.latitude==null)continue;const label=document.createElement('div');label.textContent=item.kind+' • '+item.name+' • '+item.rssi+' dBm • observed '+new Date(item.time).toLocaleString();L.circleMarker([item.latitude,item.longitude],{radius:5,color:item.kind==='BLE'?'#64f5ba':'#f5be75',fillOpacity:.65}).bindPopup(label).addTo(observations)}if(data.location){let p=data.location;L.circle([p.latitude,p.longitude],{radius:p.accuracy,color:'#70baff',weight:1}).addTo(position);L.circleMarker([p.latitude,p.longitude],{radius:7,color:'#fff',fillColor:'#459cff',fillOpacity:1}).bindPopup('Your latest location; accuracy ±'+Math.round(p.accuracy)+' m').addTo(position);if(!centered){map.setView([p.latitude,p.longitude],17);centered=true}}else if(!centered){const p=data.observations.find(p=>p.latitude!=null);if(p){map.setView([p.latitude,p.longitude],16);centered=true}}}
satellite.on('tileerror',()=>document.getElementById('note').textContent='Map imagery unavailable. Check internet or select Street. Markers show observation locations.');
</script></body></html>
